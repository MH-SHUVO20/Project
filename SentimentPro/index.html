<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BanglaSentiment Pro — Advanced Bengali language sentiment analysis powered by deep learning.">
    <title>BanglaSentiment Pro</title>
    <meta http-equiv="refresh" content="0;url=html/login.html">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5F3FF;
            font-family: 'Inter', system-ui, sans-serif;
            color: #7C3AED;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #EDE9FE;
            border-top-color: #7C3AED;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { font-size: 0.9rem; font-weight: 500; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading BanglaSentiment Pro…</p>
    </div>
</body>
